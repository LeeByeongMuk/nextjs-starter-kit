version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
